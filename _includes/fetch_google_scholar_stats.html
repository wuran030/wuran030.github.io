<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json?v=" + Date.now(), function (data) {
            var totalCitation = data['citedby']
            var totalCitationElement = document.getElementById('total_cit')
            var updateStatusElement = document.getElementById('scholar_update_status')
            if (totalCitationElement) totalCitationElement.textContent = Number(totalCitation).toLocaleString();
            if (updateStatusElement && data['updated']) {
                updateStatusElement.title = 'Scholar data updated: ' + data['updated'];
            }
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var publication = data['publications'] && data['publications'][paperId]
                if (publication) element.textContent = '| Citations: ' + publication['num_citations'];
            });
        }).fail(function () {
            var updateStatusElement = document.getElementById('scholar_update_status')
            if (updateStatusElement) {
                updateStatusElement.textContent = '{% if page.url == "/en/" or page.url == "/en/index.html" %}Temporarily unavailable{% else %}暂时无法读取{% endif %}';
            }
        });
    })
</script>
